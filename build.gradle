plugins {
	id 'net.fabricmc.fabric-loom-remap' version "${loom_version}"
}

version = project.mod_version
group = project.maven_group
base { archivesName = project.archives_base_name }

repositories {}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
}

// fabric.mod.json et la config des mixins sont générés ici : plus besoin de les ajouter à la main dans src/main/resources.
def genDir = layout.buildDirectory.dir("generated/modjson")
def genModJson = tasks.register('genModJson') {
	def out = genDir
	def ver = project.version.toString()
	inputs.property "version", ver
	outputs.dir(out)
	doLast {
		def d = out.get().asFile
		d.mkdirs()
		new File(d, 'fabric.mod.json').text = """{
  "schemaVersion": 1,
  "id": "client802",
  "version": "${ver}",
  "name": "802 Client",
  "description": "802 Client : modules, menu en jeu, GUI scale par écran et Crystal Reflex intégré (basé sur Marlow's Crystal Optimizer, MIT).",
  "authors": ["Coco802"],
  "license": "MIT",
  "icon": "assets/client802/icon.png",
  "environment": "client",
  "entrypoints": {
    "client": [
      "com.coco802.client.Client802",
      "com.deathmotion.marlowcrystal.loader.fabric.MarlowCrystalFabric"
    ]
  },
  "mixins": ["MarlowCrystal.mixins.json"],
  "depends": { "fabricloader": ">=0.17.3", "minecraft": "1.21.11", "java": ">=21", "fabric-api": "*" }
}
"""
		new File(d, 'MarlowCrystal.mixins.json').text = """{
  "required": true,
  "minVersion": "0.8",
  "package": "com.deathmotion.marlowcrystal.mixin",
  "compatibilityLevel": "JAVA_21",
  "client": [
    "ClientLevelMixin",
    "EndCrystalMixin",
    "LevelMixin",
    "MultiPlayerGameModeMixin"
  ],
  "injectors": {
    "defaultRequire": 1
  }
}
"""
	}
}
sourceSets.main.resources.srcDir(genDir)

processResources {
	dependsOn genModJson
	duplicatesStrategy = DuplicatesStrategy.EXCLUDE
	inputs.property "version", project.version
}

tasks.withType(JavaCompile).configureEach { it.options.release = 21 }

java {
	sourceCompatibility = JavaVersion.VERSION_21
	targetCompatibility = JavaVersion.VERSION_21
}
